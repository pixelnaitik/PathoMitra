name: Android

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Compile and lint Android shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Dependencies
        run: npm ci
      - name: Build and sync synthetic native bundle
        run: npm run sync:android:test
      - name: Compile debug APK, instrumentation APK and run Android lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest lintDebug
      - name: Verify manifest and synced assets
        run: npm run check:android
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug-*.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error

  emulator-smoke:
    name: Isolated Android emulator smoke
    needs: check
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: android-debug
      - name: Launch clean emulator and verify offline shell
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb wait-for-device
            APK="$(find android-debug -name 'app-debug-*.apk' -print -quit)"
            test -n "$APK"
            TEST_APK="$(find android-debug -name 'app-debug-androidTest.apk' -print -quit)"
            test -n "$TEST_APK"
            adb install -r "$APK"
            adb install -r "$TEST_APK"
            adb shell am instrument -w com.pathomitra.app.test/androidx.test.runner.AndroidJUnitRunner
            adb shell am start -n com.pathomitra.app/.MainActivity
            sleep 8
            adb shell pidof com.pathomitra.app
            if adb shell dumpsys package com.pathomitra.app | grep -q 'android.permission.INTERNET'; then
              echo '::error::The clinical Android shell must not request INTERNET.'
              exit 1
            fi

  build:
    name: Build signed release bundle
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Dependencies
        run: npm ci
      - name: Configure public release identity
        env:
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_PRIVACY_URL: ${{ vars.VITE_PRIVACY_URL }}
        run: |
          if [ -z "$VITE_SUPPORT_EMAIL" ] || [ -z "$VITE_PRIVACY_URL" ]; then
            echo '::error::VITE_SUPPORT_EMAIL and VITE_PRIVACY_URL repository variables are required.'
            exit 1
          fi
          printf 'VITE_SUPPORT_EMAIL=%s\nVITE_PRIVACY_URL=%s\n' "$VITE_SUPPORT_EMAIL" "$VITE_PRIVACY_URL" > .env
      - name: Build native bundle and sync into the Android project
        run: npm run sync:android
      - name: Require and decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_KEY_ALIAS" ] || [ -z "$KEYSTORE_KEY_PASSWORD" ] || [ -z "$KEYSTORE_STORE_PASSWORD" ]; then
            echo '::error::All KEYSTORE_* release signing secrets are required.'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release_keystore.jks"
      - name: Assemble signed release AAB and APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release_keystore.jks
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        run: cd android && ./gradlew --no-daemon bundleRelease assembleRelease && npm run check:android --prefix ..
      - name: Verify Android signatures and 16 KiB alignment
        env:
          PM_ANDROID_SIGNATURE_RESULTS: release-assets/android-signature.json
        run: npm run check:android:release
      - name: Generate provenance manifest
        env:
          PM_REQUIRE_CLEAN_MANIFEST: '1'
          PM_SIGNATURE_RESULTS: release-assets/android-signature.json
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/bundle/release/app-release.aab release-assets/app-release.aab
          cp android/app/build/outputs/apk/release/app-release-*.apk release-assets/
          npm run release:manifest -- release-assets/PathoMitra-android-manifest.json release-assets/app-release.aab release-assets/app-release-*.apk release-assets/android-signature.json
      - name: Upload verified release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pathomitra-android-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30
