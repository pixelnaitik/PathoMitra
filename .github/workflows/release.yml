name: Release

# Triggered by the git tag that `npm run release` (standard-version) creates.
# Push tags with:  git push && git push --tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build signed Android App Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          # Gradle 9.1 + AGP 8.x compile against Java 21 (see capacitor.build.gradle).
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Configure public release identity
        env:
          VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
          VITE_PRIVACY_URL: ${{ vars.VITE_PRIVACY_URL }}
        run: |
          if [ -z "$VITE_SUPPORT_EMAIL" ] || [ -z "$VITE_PRIVACY_URL" ]; then
            echo '::error::VITE_SUPPORT_EMAIL and VITE_PRIVACY_URL repository variables are required.'
            exit 1
          fi
          printf 'VITE_SUPPORT_EMAIL=%s\nVITE_PRIVACY_URL=%s\n' "$VITE_SUPPORT_EMAIL" "$VITE_PRIVACY_URL" > .env

      - name: Build native bundle and sync Android
        # Never package a web-target bundle into the clinical app.
        run: npm run sync:android

      - name: Decode release keystore
        # The keystore is stored base64-encoded in a secret so no binary or
        # password is committed. Release builds fail closed when any signing
        # input is absent; unsigned artifacts are test-only.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_KEY_ALIAS" ] || [ -z "$KEYSTORE_KEY_PASSWORD" ] || [ -z "$KEYSTORE_STORE_PASSWORD" ]; then
            echo "::error::All KEYSTORE_* release signing secrets are required."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release_keystore.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/release_keystore.jks" >> "$GITHUB_ENV"

      - name: Bundle signed release (AAB and APK)
        env:
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
        working-directory: android
        run: ./gradlew bundleRelease assembleRelease --stacktrace && npm run check:android --prefix ..

      - name: Verify Android signatures and 16 KiB alignment
        env:
          PM_ANDROID_SIGNATURE_RESULTS: release-assets/android-signature.json
        run: npm run check:android:release

      - name: Generate provenance manifest
        env:
          PM_REQUIRE_CLEAN_MANIFEST: '1'
          PM_SIGNATURE_RESULTS: release-assets/android-signature.json
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/bundle/release/app-release.aab release-assets/app-release.aab
          cp android/app/build/outputs/apk/release/app-release-*.apk release-assets/
          npm run release:manifest -- release-assets/PathoMitra-android-manifest.json release-assets/app-release.aab release-assets/app-release-*.apk release-assets/android-signature.json

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: pathomitra-aab
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Create GitHub Release
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # Full history + tags so the changelog extractor can find the section
          # that belongs to the pushed tag.
          fetch-depth: 0

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: pathomitra-aab
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Body is auto-pulled from CHANGELOG.md (the section for this tag).
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            release-assets/app-release.aab
            release-assets/app-release-*.apk
            release-assets/PathoMitra-android-manifest.json
            release-assets/android-signature.json
